#####################################################################
#   Main Config
#####################################################################
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_0F0022000251313239393734-if00

[printer]
kinematics: corexy        
max_velocity: 900
max_accel: 60000
minimum_cruise_ratio: 0.5
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 5.0 #should prolly be tuned for higher values

[force_move]
enable_force_move: True

[input_shaper] 
damping_ratio_x: 0.032
damping_ratio_y: 0.042
shaper_type_x = ei
shaper_freq_x = 102.4
shaper_type_y = mzv
shaper_freq_y = 63.4

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_C3EE33AF5154364134202020FF153C17-if00
x_offset: 0 
y_offset: 20 # was 24
mesh_main_direction: x
mesh_runs: 2

home_xy_position: 172.5, 190 # update with your safe position
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 200
home_method: proximity # use proximity for induction homing
home_method_when_homed: proximity # after initial calibration use induction
home_autocalibrate: never # contact will calibrate beacon on first home
home_gcode_post_x: _HOME_POST_AXIS AXIS=X

accel_axes_map: x, -y, -z

[resonance_tester]
#accel_chip: adxl345
accel_chip: beacon

probe_points:
    155, 155, 20   

[bed_mesh]
horizontal_move_z: 3.0 
speed: 200
mesh_min: 20, 70
mesh_max: 325, 335
probe_count: 15, 15
algorithm: bicubic
scan_overshoot: 5

#####################################################################
#   Temp Sensors
#####################################################################
[temperature_sensor octo_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

####################################################################
#   Bed Heater
#####################################################################
[heater_bed]
heater_pin: PA0 
sensor_type: Generic 3950 
sensor_pin: PF3
max_power: 0.75
min_temp: 5
max_temp: 115
control : pid
pid_kp : 73.571
pid_ki : 1.820
pid_kd : 783.849

[verify_heater heater_bed]
max_error: 120 
check_gain_time:40
hysteresis: 5
heating_gain: 2

#####################################################################
#  Extruder temp tolerance override
#####################################################################
[gcode_macro M109] # Wait Hotend Temp
rename_existing: M109.1
gcode:
    #Parameters
    {% set s = params.S|float %}

    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  # Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-5} MAXIMUM={s+5}   # Wait for hotend temp (within n degrees)
    {% endif %}

#####################################################################
#   Toolhead
#####################################################################
[mcu nhk]
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_rp2040_4E363334320E263A-if00
restart_method: command
##--------------------------------------------------------------------

## HEF
[heater_fan hotend_fan]
pin: nhk:gpio5
tachometer_pin: nhk:gpio16
tachometer_ppr: 2
max_power: 1.0

## PCB Activity Light
[output_pin act_led]
pin: !nhk:gpio8

[temperature_sensor NH36]
sensor_type: temperature_mcu
sensor_mcu: nhk
min_temp: 0
max_temp: 100
#####################################################################
# 	Extruder
#####################################################################
[extruder]
step_pin: nhk:gpio23
dir_pin: nhk:gpio24
enable_pin: !nhk:gpio25
heater_pin: PA1
sensor_pin: PF4

pullup_resistor: 4700
microsteps: 32
rotation_distance: 4.488

sensor_type: PT1000
min_temp: 5                  
max_temp: 360 
control : pid
pid_kp : 31.834
pid_ki : 10.611
pid_kd : 23.877

nozzle_diameter: 1.0
filament_diameter: 1.75  
